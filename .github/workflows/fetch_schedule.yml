name: Fetch Full Schedule

# One-off pull of the complete 2026 regular-season schedule (all 14 weeks of
# team-vs-team pairings, including weeks that haven't been played yet).
# Manual only -- click "Run workflow" in the Actions tab whenever you want a
# fresh copy of schedule.json (e.g. after editing matchups in ESPN).
#
# Uses the same ESPN_S2 / SWID secrets already set up for update.yml and
# backfill.yml -- nothing new to configure.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch full season schedule
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python fetch_schedule.py
      - name: Commit schedule.json if it changed
        run: |
          git config user.name "come-get-some-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || git commit -m "Fetch full 2026 schedule $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
