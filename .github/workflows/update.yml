name: Update ESPN Data

on:
  schedule:
    # Runs daily at 11:00 UTC (~6-7am ET depending on daylight saving).
    # Change the cron value any time -- crontab.guru is a handy reference.
    - cron: '0 11 * * *'
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab for on-demand runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch ESPN data
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python fetch_espn.py

      - name: Commit data.json if it changed
        run: |
          git config user.name "come-get-some-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update league data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
