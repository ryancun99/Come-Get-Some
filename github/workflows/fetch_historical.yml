name: Fetch Historical ESPN Data (one-time)

# Manual trigger only -- this is a one-time historical pull, not a recurring job.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch historical ESPN data
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python fetch_espn_historical.py

      - name: Commit history_data.json
        run: |
          git config user.name "come-get-some-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history_data.json
          git diff --staged --quiet || git commit -m "Add historical ESPN data pull"
          git push
